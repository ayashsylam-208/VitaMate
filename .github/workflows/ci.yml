name: VitaMate CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GITLEAKS_VERSION: "8.24.2"
  PYTHON_VERSION: "3.13"
  FLUTTER_CHANNEL: stable

jobs:
  gitleaks:
    name: Security (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          mkdir -p /tmp/gitleaks
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks

      - name: Stage repository for snapshot scan
        run: git add -A

      - name: Run Gitleaks scan
        run: /tmp/gitleaks/gitleaks git --pre-commit --staged --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose

  pre-commit:
    name: Quality (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit and Gitleaks
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          mkdir -p /tmp/gitleaks
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          sudo mv /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks

      - name: Stage repository for staged-only hooks
        run: git add -A

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    name: Backend Tests (Django + Postgres)
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitamate
          POSTGRES_USER: vitamate
          POSTGRES_PASSWORD: vitamate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitamate -d vitamate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Implementation/vitamate_backend
    env:
      DJANGO_ENV: dev
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: vitamate
      POSTGRES_USER: vitamate
      POSTGRES_PASSWORD: vitamate
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Implementation/vitamate_backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations on CI database
        run: python manage.py migrate --noinput

      - name: Run backend tests
        run: python manage.py test users core gamification

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    defaults:
      run:
        working-directory: Implementation/vitamate_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Analyze frontend code
        run: flutter analyze

  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    defaults:
      run:
        working-directory: Implementation/vitamate_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Run frontend tests
        run: flutter test

  flutter-integration-test:
    name: Flutter Integration Test
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
      - backend-tests
      - flutter-analyze
      - flutter-test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitamate
          POSTGRES_USER: vitamate
          POSTGRES_PASSWORD: vitamate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitamate -d vitamate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: dev
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
      POSTGRES_DB: vitamate
      POSTGRES_USER: vitamate
      POSTGRES_PASSWORD: vitamate
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      API_BASE_URL: http://10.0.2.2:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Implementation/vitamate_backend/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install backend dependencies
        working-directory: Implementation/vitamate_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: Implementation/vitamate_frontend
        run: flutter pub get

      - name: Apply migrations for integration environment
        working-directory: Implementation/vitamate_backend
        run: python manage.py migrate --noinput

      - name: Seed reproducible E2E user
        working-directory: Implementation/vitamate_backend
        run: python manage.py seed_integration_user --scenario chronic_flow --reset

      - name: Start Django backend in background
        working-directory: Implementation/vitamate_backend
        run: |
          mkdir -p /tmp/vitamate-integration
          nohup python manage.py runserver 0.0.0.0:8000 > /tmp/vitamate-integration/django.log 2>&1 &
          echo $! > /tmp/vitamate-integration/django.pid

      - name: Wait for backend health endpoint
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health/ > /tmp/vitamate-integration/health.json; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check did not become ready in time." >&2
          exit 1

      - name: Run Flutter integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: |
            bash -lc '
              set -o pipefail
              cd Implementation/vitamate_frontend
              flutter drive --driver=test_driver/integration_test.dart --target=integration_test/smoke_login_home_test.dart -d emulator-5554 --dart-define=API_BASE_URL=${API_BASE_URL} | tee /tmp/vitamate-integration/flutter-smoke.log
              flutter drive --driver=test_driver/integration_test.dart --target=integration_test/chronic_flow_test.dart -d emulator-5554 --dart-define=API_BASE_URL=${API_BASE_URL} | tee /tmp/vitamate-integration/flutter-chronic.log
            '

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-integration-logs
          path: /tmp/vitamate-integration
