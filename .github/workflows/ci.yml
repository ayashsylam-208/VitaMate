name: VitaMate CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GITLEAKS_VERSION: "8.24.2"
  PYTHON_VERSION: "3.13"
  FLUTTER_CHANNEL: stable

jobs:
  gitleaks:
    name: Security (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          mkdir -p /tmp/gitleaks
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks

      - name: Stage repository for snapshot scan
        run: git add -A

      - name: Run Gitleaks scan
        run: /tmp/gitleaks/gitleaks git --pre-commit --staged --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose

  pre-commit:
    name: Quality (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit and Gitleaks
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          mkdir -p /tmp/gitleaks
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          sudo mv /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks

      - name: Stage repository for staged-only hooks
        run: git add -A

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    name: Backend Tests (Django + Postgres)
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitamate
          POSTGRES_USER: vitamate
          POSTGRES_PASSWORD: vitamate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitamate -d vitamate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Implementation/vitamate_backend
    env:
      DJANGO_ENV: dev
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: vitamate
      POSTGRES_USER: vitamate
      POSTGRES_PASSWORD: vitamate
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Implementation/vitamate_backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations on CI database
        run: python manage.py migrate --noinput

      - name: Run backend tests
        run: python manage.py test users core gamification

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    defaults:
      run:
        working-directory: Implementation/vitamate_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Analyze frontend code
        run: flutter analyze

  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    defaults:
      run:
        working-directory: Implementation/vitamate_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Run frontend tests
        run: flutter test
