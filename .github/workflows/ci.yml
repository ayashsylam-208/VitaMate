name: CI_test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  gitleaks:
    name: Security (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks

      - name: Run Gitleaks scan
        run: ./gitleaks detect --source . --config .gitleaks.toml --no-git --redact --verbose

  pre-commit:
    name: Quality (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    defaults:
      run:
        working-directory: Implementation/vitamate_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Implementation/vitamate_backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - pre-commit
    defaults:
      run:
        working-directory: Implementation/vitamate_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Analyze frontend code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run frontend tests
        run: flutter test
